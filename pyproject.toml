[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-assess"
version = "0.1.0"
description = "Authorized MCP Assessment CLI — Host Config discovery, Surface Maps, Checks, and Reports"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "mcp-assess" }]
keywords = ["mcp", "assessment", "security", "owasp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = [
  "mcp==2.2.0",
  "httpx2>=0.0.1",
  "anyio>=4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
]

[project.scripts]
mcp-assess = "mcp_assess.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_assess"]

[tool.hatch.build.targets.wheel.force-include]
"src/mcp_assess/share" = "mcp_assess/share"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
